[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: tests that take more than a second
    requires_postgres: needs a live Postgres+AGE instance with migrations applied; skipped by default (see tests/test_rls_integration.py's module docstring for how to run it)
