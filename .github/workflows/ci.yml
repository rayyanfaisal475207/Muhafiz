name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.lock.txt

      # The suite mocks every external boundary and blocks network access,
      # so no API keys or database are needed here.
      #
      # --cov is report-only (no --cov-fail-under) — it makes real test
      # coverage visible without requiring anyone to manually infer it, but
      # doesn't block merges on a threshold nobody's agreed to yet.
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      # Non-blocking dependency-vulnerability scan: reports findings for
      # triage, doesn't fail the build. Fail-the-build is a deliberate
      # follow-up once the team has looked at whatever this finds.
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock.txt
        continue-on-error: true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.app }}

      - run: npm run build
        working-directory: ${{ matrix.app }}

      # Non-blocking dependency-vulnerability scan, same rationale as the
      # backend's pip-audit step above.
      - run: npm audit
        working-directory: ${{ matrix.app }}
        continue-on-error: true
